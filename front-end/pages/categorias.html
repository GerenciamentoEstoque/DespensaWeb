<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categorias · Despensa Web</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <aside class="sidebar d-flex flex-column p-3 text-white">
            <a href="inicio.html" class="d-flex align-items-center mb-4 text-white text-decoration-none brand-text fs-4 fw-bold gap-2">
                <i class="brand-icon">🥫</i> Despensa Web
            </a>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item"><a href="inicio.html" class="nav-link ">🏠 Início</a></li>
                <li class="nav-item"><a href="produtos.html" class="nav-link ">📦 Produtos</a></li>
                <li class="nav-item"><a href="categorias.html" class="nav-link active">🏷️ Categorias</a></li>
                <li class="nav-item"><a href="movimentacoes.html" class="nav-link ">🔄 Movimentação</a></li>
                <li class="nav-item"><a href="configuracoes.html" class="nav-link ">⚙️ Configurações</a></li>
            </ul>
            <hr class="border-secondary">
            <div class="user-info">
                <strong>Usuário Demo</strong>
                <div class="small text-white-50">demo@despensaweb.com</div>
                <a href="index.html" id="botao-sair" class="text-warning text-decoration-none mt-1 d-block small">Sair</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-grow-1 p-4 p-md-5" style="max-width: 1200px; min-width: 0;">
            
            <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-3">
                <div>
                    <h1 class="mb-0">Categorias</h1>
                    <p class="text-muted mb-0">Organize os produtos por grupo.</p>
                </div>
                <button id="botao-nova" class="btn btn-primary fw-bold">+ Nova categoria</button>
            </div>

            <!-- Lista deCategorias -->
            <p id="mensagem-lista" class="text-muted"></p>
            <div class="row g-4" id="lista-categorias"></div>

            <!-- Modal Formulário Categoria -->
            <div class="modal fade" id="modalCategoria" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content border-0" style="border-radius: 16px;">
                        <div class="modal-header border-0 pb-0">
                            <h4 class="modal-title fw-bold" id="titulo-modal-categoria">Categoria</h4>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div>
                                <label for="categoria-nome" class="form-label fw-bold small text-secondary">Nome</label>
                                <input type="text" id="categoria-nome" class="form-control" maxlength="100">
                            </div>
                            <p id="erro-categoria" class="text-danger small mt-2 mb-0" role="alert"></p>
                        </div>
                        <div class="modal-footer border-0 pt-0">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" id="botao-salvar-categoria" class="btn btn-primary">Salvar categoria</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Excluir reaproveitado -->
            <div class="modal fade" id="modalDelete" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content border-0" style="border-radius: 16px;">
                        <div class="modal-header border-0 pb-0">
                            <h4 class="modal-title fw-bold text-danger">Excluir registro</h4>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            Tem certeza que deseja excluir a categoria <strong id="nome-categoria-excluir"></strong>?
                            <p id="erro-exclusao" class="text-danger small mt-2 mb-0" role="alert"></p>
                        </div>
                        <div class="modal-footer border-0 pt-0">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" id="botao-confirmar-exclusao" class="btn btn-danger">Sim, excluir</button>
                        </div>
                    </div>
                </div>
            </div>
        
        </main>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/categorias.js"></script>
</body>
</html>
