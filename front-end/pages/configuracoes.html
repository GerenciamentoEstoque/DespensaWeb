<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configurações · Despensa Web</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <aside class="sidebar d-flex flex-column p-3 text-white">
            <a href="inicio.html" class="d-flex align-items-center mb-4 text-white text-decoration-none brand-text fs-4 fw-bold gap-2">
                <i class="brand-icon">🥫</i> Despensa Web
            </a>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item"><a href="inicio.html" class="nav-link ">🏠 Início</a></li>
                <li class="nav-item"><a href="produtos.html" class="nav-link ">📦 Produtos</a></li>
                <li class="nav-item"><a href="categorias.html" class="nav-link ">🏷️ Categorias</a></li>
                <li class="nav-item"><a href="movimentacoes.html" class="nav-link ">🔄 Movimentação</a></li>
                <li class="nav-item"><a href="configuracoes.html" class="nav-link active">⚙️ Configurações</a></li>
            </ul>
            <hr class="border-secondary">
            <div class="user-info">
                <strong>Usuário Demo</strong>
                <div class="small text-white-50">demo@despensaweb.com</div>
                <a href="index.html" class="text-warning text-decoration-none mt-1 d-block small">Sair</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-grow-1 p-4 p-md-5" style="max-width: 1200px; min-width: 0;">
            
            <div class="mb-4">
                <h1 class="mb-0">Configurações</h1>
                <p class="text-muted mb-0">Seus dados e sua senha.</p>
            </div>

            <div class="row g-4">
                <div class="col-md-6">
                    <form class="card p-4">
                        <h4 class="mb-4">Dados pessoais</h4>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-secondary">Nome</label>
                            <input type="text" class="form-control" value="Usuário Demo">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-secondary">E-mail</label>
                            <input type="email" class="form-control" value="demo@despensaweb.com">
                        </div>
                        <button type="button" class="btn btn-primary" onclick="alert('Salvo!')">Salvar dados</button>
                    </form>
                </div>
                
                <div class="col-md-6">
                    <form class="card p-4">
                        <h4 class="mb-4">Alterar senha</h4>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-secondary">Senha atual</label>
                            <input type="password" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-secondary">Nova senha</label>
                            <input type="password" class="form-control">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-secondary">Confirmar nova senha</label>
                            <input type="password" class="form-control">
                        </div>
                        <button type="button" class="btn btn-primary" onclick="alert('Senha alterada!')">Alterar senha</button>
                    </form>
                </div>
            </div>
        
        </main>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
