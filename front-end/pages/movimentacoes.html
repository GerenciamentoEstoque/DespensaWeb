<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movimentação · Despensa Web</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <aside class="sidebar d-flex flex-column p-3 text-white">
            <a href="inicio.html" class="d-flex align-items-center mb-4 text-white text-decoration-none brand-text fs-4 fw-bold gap-2">
                <i class="brand-icon">🥫</i> Despensa Web
            </a>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item"><a href="inicio.html" class="nav-link ">🏠 Início</a></li>
                <li class="nav-item"><a href="produtos.html" class="nav-link ">📦 Produtos</a></li>
                <li class="nav-item"><a href="categorias.html" class="nav-link ">🏷️ Categorias</a></li>
                <li class="nav-item"><a href="movimentacoes.html" class="nav-link active">🔄 Movimentação</a></li>
                <li class="nav-item"><a href="configuracoes.html" class="nav-link ">⚙️ Configurações</a></li>
            </ul>
            <hr class="border-secondary">
            <div class="user-info">
                <strong>Usuário Demo</strong>
                <div class="small text-white-50">demo@despensaweb.com</div>
                <a href="index.html" id="botao-sair" class="text-warning text-decoration-none mt-1 d-block small">Sair</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-grow-1 p-4 p-md-5" style="max-width: 1200px; min-width: 0;">

            <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-3">
                <div>
                    <h1 class="mb-0">Movimentação</h1>
                    <p class="text-muted mb-0">Entradas e saídas do estoque.</p>
                </div>
                <button id="botao-nova" class="btn btn-primary fw-bold">+ Nova movimentação</button>
            </div>

            <!-- Filtros -->
            <div class="d-flex gap-2 mb-4 flex-wrap">
                <select id="filtro-produto" class="form-select w-auto" aria-label="Filtrar por produto">
                    <option value="">Todos os produtos</option>
                </select>
                <input type="date" id="filtro-data-inicial" class="form-control w-auto" aria-label="Data inicial" title="Data inicial">
                <input type="date" id="filtro-data-final" class="form-control w-auto" aria-label="Data final" title="Data final">
            </div>

            <p id="mensagem-lista" class="text-muted"></p>

            <!-- Tabela (linhas geradas pelo JavaScript) -->
            <div class="card overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light text-muted small">
                            <tr>
                                <th class="py-3">Data</th>
                                <th class="py-3">Produto</th>
                                <th class="py-3">Categoria</th>
                                <th class="py-3">Tipo</th>
                                <th class="py-3">Quantidade</th>
                                <th class="py-3">Observação</th>
                            </tr>
                        </thead>
                        <tbody id="corpo-movimentacoes"></tbody>
                    </table>
                </div>
            </div>

            <!-- Modal Formulário Movimentação -->
            <div class="modal fade" id="modalMovimentacao" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content border-0" style="border-radius: 16px;">
                        <div class="modal-header border-0 pb-0">
                            <h4 class="modal-title fw-bold">Registrar Movimentação</h4>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="mov-produto" class="form-label fw-bold small text-secondary">Produto</label>
                                <select id="mov-produto" class="form-select"></select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold small text-secondary">Tipo</label>
                                <div class="d-flex gap-2">
                                    <input type="radio" class="btn-check" name="tipo" id="tipo-entrada" autocomplete="off" checked>
                                    <label class="btn btn-outline-success w-50" for="tipo-entrada">⬇️ Entrada</label>

                                    <input type="radio" class="btn-check" name="tipo" id="tipo-saida" autocomplete="off">
                                    <label class="btn btn-outline-danger w-50" for="tipo-saida">⬆️ Saída</label>
                                </div>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-sm-6">
                                    <label for="mov-quantidade" class="form-label fw-bold small text-secondary">Quantidade</label>
                                    <input type="number" id="mov-quantidade" class="form-control" min="0">
                                </div>
                                <div class="col-sm-6">
                                    <label for="mov-saldo" class="form-label fw-bold small text-secondary">Saldo atual</label>
                                    <input type="text" id="mov-saldo" class="form-control" disabled>
                                </div>
                            </div>
                            <div>
                                <label for="mov-observacao" class="form-label fw-bold small text-secondary">Observação (opcional)</label>
                                <input type="text" id="mov-observacao" class="form-control" maxlength="200">
                            </div>
                            <p class="small text-muted mt-3 mb-0">A data é registrada automaticamente.</p>
                            <p id="erro-movimentacao" class="text-danger small mt-2 mb-0" role="alert"></p>
                        </div>
                        <div class="modal-footer border-0 pt-0">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" id="botao-salvar-movimentacao" class="btn btn-primary">Confirmar</button>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/movimentacoes.js"></script>
</body>
</html>
