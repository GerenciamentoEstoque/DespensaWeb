<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · Despensa Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="row g-0 auth-wrapper">
        <div class="col-lg-6 auth-hero auth-bg p-5 d-none d-lg-flex flex-column justify-content-between">
            <div class="brand-text fs-1 fw-bold d-flex align-items-center gap-2"  style="color: var(--pine-light);">
                Despensa Web
            </div>
            <div>
                <h1 class="display-4 fw-bold mb-4">Sua despensa sob controle.</h1>
                <p class="fs-5 text-white-50">Veja o que tem, o que está acabando e o que entrou ou saiu do estoque do restaurante.</p>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <span class="badge border border-light text-light rounded-pill px-3 py-2 fw-normal">Produtos</span>
                <span class="badge border border-light text-light rounded-pill px-3 py-2 fw-normal">Categorias</span>
                <span class="badge border border-light text-light rounded-pill px-3 py-2 fw-normal">Entradas e saídas</span>
            </div>
        </div>
        <div class="col-lg-6 d-flex align-items-center justify-content-center p-4">
            <div style="width: 100%; max-width: 400px;">
                
            <h2 class="mb-1">Redefinir Senha</h2>
            <p class="text-muted mb-4">Informe o token e sua nova senha.</p>
            <form action="inicio.html">
                <div class="mb-3">
                    <label class="form-label fw-bold small text-secondary">Token</label>
                    <input type="text" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold small text-secondary">Nova Senha</label>
                    <input type="password" class="form-control" required>
                <div class="mb-4">
                    <label class="form-label fw-bold small text-secondary">Confirmar Senha</label>
                    <input type="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Redefinir</button>
                <div class="d-flex justify-content-between mt-3 small">
                    <a href="index.html" class="text-decoration-none text-primary">Login</a>
                    <a href="cadastro.html" class="text-decoration-none text-primary">Criar conta</a>
                </div>
            </form>
        
            </div>
        </div>
    </div>
</body>
</html>
